# 宝塔 WAF Nginx 注入配置
# 此文件将被 include 到 nginx.conf 的 http {} 块中

# 开辟 10MB 的共享内存池，用于存储 IP 评分与限流数据
lua_shared_dict waf_ip_scores 10m;

# 设置 Lua 包搜索路径
lua_package_path "/www/server/nginx/conf/waf/?.lua;;";

# Nginx 启动时加载 WAF 规则到全局内存 (提升性能)
init_by_lua_block {
    require "init"
}

# 请求入口处拦截
access_by_lua_file /www/server/nginx/conf/waf/access.lua;
